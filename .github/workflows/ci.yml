name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Test repository truth contract
        shell: pwsh
        run: ./build/Test-RepositoryTruthContract.ps1

      - name: Validate repository truth
        shell: pwsh
        run: ./build/Validate-RepositoryTruth.ps1

      - name: Restore
        run: dotnet restore Zapret2Pilot.slnx

      - name: Vulnerability audit
        run: dotnet package list --project Zapret2Pilot.slnx --vulnerable --include-transitive --no-restore

      - name: Deprecated package evidence
        run: dotnet package list --project Zapret2Pilot.slnx --deprecated --include-transitive --no-restore

      - name: Package drift evidence
        run: dotnet package list --project Zapret2Pilot.slnx --outdated --include-transitive --no-restore --source https://api.nuget.org/v3/index.json

      # Temporary #15 evidence step. It makes the first generated lock graph
      # observable in CI so the exact files can be committed before the final
      # workflow switches restore to --locked-mode.
      - name: Show generated package locks
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter packages.lock.json -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($PWD.Path, $_.FullName)
            Write-Host "Z2P_LOCK_BEGIN:$relative"
            Get-Content -LiteralPath $_.FullName -Raw
            Write-Host "Z2P_LOCK_END:$relative"
          }

      - name: Build
        shell: pwsh
        run: |
          $output = & dotnet build Zapret2Pilot.slnx -c Release --no-restore 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath issue15-build.log
          exit $exitCode

      - name: Upload issue #15 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue15-diagnostics
          if-no-files-found: error
          path: |
            issue15-build.log
            **/packages.lock.json

      - name: Test
        run: dotnet test Zapret2Pilot.slnx -c Release --no-build --logger trx --results-directory TestResults
