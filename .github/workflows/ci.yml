name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Test repository truth contract
        shell: pwsh
        run: ./build/Test-RepositoryTruthContract.ps1

      - name: Validate repository truth
        shell: pwsh
        run: ./build/Validate-RepositoryTruth.ps1

      - name: Restore
        run: dotnet restore Zapret2Pilot.slnx

      - name: Vulnerability audit
        run: dotnet package list --project Zapret2Pilot.slnx --vulnerable --include-transitive --no-restore

      - name: Deprecated package evidence
        run: dotnet package list --project Zapret2Pilot.slnx --deprecated --include-transitive --no-restore

      - name: Package drift evidence
        run: dotnet package list --project Zapret2Pilot.slnx --outdated --include-transitive --no-restore --source https://api.nuget.org/v3/index.json

      - name: Show generated package locks
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter packages.lock.json -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($PWD.Path, $_.FullName)
            Write-Host "Z2P_LOCK_BEGIN:$relative"
            Get-Content -LiteralPath $_.FullName -Raw
            Write-Host "Z2P_LOCK_END:$relative"
          }

      - name: Validate committed package locks
        shell: pwsh
        run: |
          $trackedLocks = @(git ls-files -- ':(glob)**/packages.lock.json')
          if ($trackedLocks.Count -eq 0) {
            Write-Error "No committed packages.lock.json files were found. Restore must produce a committed deterministic lock graph."
            exit 1
          }

          $untrackedLocks = @(git ls-files --others --exclude-standard -- ':(glob)**/packages.lock.json')
          if ($untrackedLocks.Count -ne 0) {
            Write-Host "Restore produced untracked package locks:"
            $untrackedLocks | ForEach-Object { Write-Host "  $_" }
            Write-Error "Package lock graph is incomplete. Regenerate and commit the lock files in the PR branch."
            exit 1
          }

          git diff --exit-code -- ':(glob)**/packages.lock.json'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Restore changed committed package locks. Regenerate and commit the deterministic lock graph in the PR branch; CI must not mutate repository state."
            exit 1
          }

          Write-Host "Committed package locks match the restored dependency graph."

      - name: Locked restore
        run: dotnet restore Zapret2Pilot.slnx --locked-mode

      - name: Build
        shell: pwsh
        run: |
          $output = & dotnet build Zapret2Pilot.slnx -c Release --no-restore 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath issue15-build.log
          exit $exitCode

      - name: Upload issue #15 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue15-diagnostics
          if-no-files-found: error
          path: |
            issue15-build.log
            **/packages.lock.json

      - name: Test
        run: dotnet test Zapret2Pilot.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Verify repository remains clean
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain)
          if ($dirty.Count -ne 0) {
            Write-Host "Repository changes after restore/build/test:"
            $dirty | ForEach-Object { Write-Host $_ }
            Write-Error "CI validation changed repository state. Generated dependency state must be committed explicitly in the PR branch."
            exit 1
          }
          Write-Host "Repository remains clean after validation."
