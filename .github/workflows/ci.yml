name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore Zapret2Pilot.slnx

      - name: Build
        run: dotnet build Zapret2Pilot.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Zapret2Pilot.slnx -c Release --no-build --logger trx --results-directory TestResults
